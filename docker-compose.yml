services:
  napcat:
    container_name: napcat
    image: mlikiowa/napcat-docker:v4.4.4
    restart: on-failure:3
    ports:
      - "3001:3001"
      - "6099:6099"
    volumes:
      - "QQConfig:/app/.config/QQ"
      - "NapcatConfig:/app/napcat/config"

  web-scraper-trpc:
    build:
      context: .
    restart: on-failure:3
    working_dir: /arona/external/web-scraper/trpc-server
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      REDIS: redis://host.docker.internal:6379/1
    command: npm run start

  twitter-subscriber:
    build:
      context: .
    restart: on-failure:3
    working_dir: /arona/arona
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      STATIC_HOST: twitter-subscriber
      ONEBOT_ORIGIN: napcat:3001
      REDIS: redis://host.docker.internal:6379/1
      TRPC_SERVER: http://web-scraper-trpc:3000
    command: npm run docker-start

volumes:
  QQConfig:
    external: true
  NapcatConfig:
    external: true
