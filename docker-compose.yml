services:
  lagrange:
    container_name: lagrange
    image: ghcr.io/lagrangedev/lagrange.onebot:edge
    restart: on-failure:3
    ports:
      - "6099:6099"
    volumes:
      - ./onebot/lagrange.json:/app/data/appsettings.json
      - LagrangeData:/app/data

  scraper:
    build:
      context: .
    restart: on-failure:3
    working_dir: /arona/external/web-scraper/trpc-server
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      REDIS: redis://host.docker.internal:6379/1
    command: npm run start

  arona:
    build:
      context: .
    restart: on-failure:3
    working_dir: /arona/arona
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      STATIC_HOST: arona
      ONEBOT_ORIGIN: lagrange:6099
      REDIS: redis://host.docker.internal:6379/1
      TRPC_SERVER: http://scraper:3000
    command: npm run docker-start

volumes:
  LagrangeData:
    external: true
